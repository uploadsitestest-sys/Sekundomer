<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Неоновий Секундомер</title>
    <link rel="stylesheet" href="style.css">
    <!-- Підключення футуристичного шрифту -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="stopwatch-container">
        <div class="display" id="display">
            00:00:00<span class="ms">.00</span>
        </div>
        
        <div class="controls">
            <button id="startBtn" class="btn neon-green">Почати</button>
            <button id="pauseBtn" class="btn neon-yellow" disabled>Пауза</button>
            <button id="resetBtn" class="btn neon-pink">Скинути</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
